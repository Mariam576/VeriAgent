# Start everything:   docker compose up --build      then open http://localhost:8000
# Stop:               docker compose down
# Stop + wipe data:   docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veriagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Lets you inspect the database from your own PC only (127.0.0.1), on
      # port 5433 so it does not clash with a PostgreSQL installed on Windows.
      # Change DB_PORT in .env if you need another port.
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      # "-h 127.0.0.1" waits for the real server, not the temporary one that
      # runs while the database is being initialised for the first time.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d veriagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    # The API and the web interface. The image builds the interface itself (see Dockerfile).
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database host is the service name "db".
      DATABASE_URL: postgresql://postgres:postgres@db:5432/veriagent
      UPLOAD_DIR: /app/uploads
      TICKETS_FILE: /app/data/tickets.jsonl
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1: reachable from this computer only. To let other
      # people use it, deploy it properly (docs/DEPLOYMENT.md) instead of opening this port.
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      # Keeps the downloaded embedding model between restarts.
      - hf_cache:/home/app/.cache/huggingface

volumes:
  pgdata:
  uploads:
  data:
  hf_cache:
