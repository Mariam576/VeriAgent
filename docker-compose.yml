# Start everything:   docker compose up --build
# Stop:               docker compose down
# Stop + wipe data:   docker compose down -v
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veriagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Lets you inspect the database from your PC. Change DB_PORT in .env if
      # 5432 is already used by another PostgreSQL on your machine.
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veriagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside Docker the database host is the service name "db".
      DATABASE_URL: postgresql://postgres:postgres@db:5432/veriagent
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - uploads:/app/uploads
      # Keeps the downloaded embedding model between restarts.
      - hf_cache:/home/app/.cache/huggingface

volumes:
  pgdata:
  uploads:
  hf_cache:
